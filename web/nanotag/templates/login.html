{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:80px auto">
  <h1>NanoTag <span class="muted" style="font-size:14px;font-weight:500">v{{ version }}</span></h1>
  <p class="muted">Nanopore event tagging, NN landmarks and clustering.</p>
  <form method="post">
    <p><input type="text" name="username" placeholder="Username" autofocus required style="width:100%"></p>
    <p><input type="password" name="password" placeholder="Password" required style="width:100%"></p>
    <p><button class="primary" type="submit" style="width:100%">Sign in</button></p>
  </form>
</div>
{% endblock %}
